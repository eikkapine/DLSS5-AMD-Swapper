<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NR Static Image Test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #20242a; }
  canvas, img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
<canvas id="pattern" width="960" height="540"></canvas>
<script>
  // Original deterministic fixture. A private local photo can be supplied in the URL.
  const source = new URLSearchParams(location.search).get('image');
  const canvas = document.querySelector('canvas');
  if (source) {
    const img = new Image();
    img.alt = 'Static image for local neural rendering verification';
    img.src = source;
    canvas.replaceWith(img);
  } else {
    const context = canvas.getContext('2d');
    for (let y = 0; y < 540; y += 24) {
      for (let x = 0; x < 960; x += 24) {
        const dark = ((x / 24 + y / 24) % 2) * 0.45 + 0.55;
        context.fillStyle = `rgb(${255 * x / 960 * dark},${255 * y / 540 * dark},${120 * dark})`;
        context.fillRect(x, y, 24, 24);
      }
    }
  }
</script>
</html>
