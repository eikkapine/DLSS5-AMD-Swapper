    <path d="M44 40 H116 V62 H67 L63 82 C71 77 81 75 91 75 C113 75 128 89 128 112 C128 138 108 153 80 153 C58 153 40 144 28 129 L45 111 C54 121 64 127 77 127 C89 127 98 121 98 111 C98 101 90 95 79 95 C69 95 61 99 54 105 L34 97Z" fill="#fff" transform="translate(0 -18)"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="270" y="116" fill="#ff8362" font-size="18" font-weight="700" letter-spacing="3">AMD NEURAL RENDERING</text>
    <text x="270" y="180" fill="#ffffff" font-size="54" font-weight="760">DLSS5 AMD Swapper</text>
