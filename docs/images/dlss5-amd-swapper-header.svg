<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DLSS5 AMD Swapper</title>
  <desc id="desc">Dark themed DLSS5 AMD Swapper project header with coral gradient icon and AMD route ready status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="0.62" stop-color="#111722"/>
      <stop offset="1" stop-color="#151016"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4e43"/>
      <stop offset="1" stop-color="#ff8a46"/>
